# Serve the repo exactly as-is. The game is a single large static index.html with a
# ~2.5MB inline <script>; Netlify's asset post-processing (bundle/minify/snippet
# injection) can corrupt that inline script and produce "Unexpected end of input".
# skip_processing = true publishes the files byte-for-byte, no transforms.
[build]
  publish = "."

[build.processing]
  skip_processing = true

[build.processing.html]
  pretty_urls = false
